input {
  beats {
    port => 5044
  }
}

filter {
  # Парсим Docker JSON формат
  json {
    source => "message"
    target => "docker_log"
  }
  
  # Извлекаем реальное сообщение
  if [docker_log][log] {
    mutate {
      copy => { "[docker_log][log]" => "message" }
    }
  }
  
  # Удаляем временные поля
  mutate {
    remove_field => ["docker_log"]
  }
  
  # Очищаем сообщение
  if [message] {
    mutate {
      gsub => ["message", "\n$", ""]
      strip => ["message"]
    }
  }
  
  # Используем container.name из метаданных Docker
  # вместо ручного определения
  if [container][name] {
    mutate {
      add_field => { "log_type" => "%{[container][name]}" }
    }
  }
}

output {
  # Отправляем в индекс на основе container.name
  if [container][name] == "dummy" {
    elasticsearch {
      hosts => ["http://elasticsearch-hot:9200"]
      index => "logstash-logs-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch-hot:9200"]
      index => "docker-logs-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  }
}